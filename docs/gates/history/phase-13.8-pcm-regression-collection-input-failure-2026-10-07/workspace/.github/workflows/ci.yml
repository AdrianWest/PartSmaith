name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install local multilingual OCR on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes tesseract-ocr tesseract-ocr-eng tesseract-ocr-deu tesseract-ocr-chi-sim
      - name: Install local multilingual OCR on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          $ocrDirectory = Join-Path $env:ProgramFiles 'Tesseract-OCR'
          "$ocrDirectory" | Out-File -FilePath $env:GITHUB_PATH -Append
          foreach ($language in @('eng', 'deu', 'chi_sim')) {
            $model = Join-Path $ocrDirectory "tessdata/$language.traineddata"
            Invoke-WebRequest "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/4.1.0/$language.traineddata" -OutFile $model
          }
      - name: Install pinned KiCad 10 on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          KICAD_VERSION="$(apt-cache madison kicad | awk '$3 ~ /^10\.0\.6/ {print $3; exit}')"
          test -n "$KICAD_VERSION"
          sudo apt-get install --yes "kicad=$KICAD_VERSION"
      - name: Install pinned KiCad 10 on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\scripts\setup_kicad.ps1 -Version 10.0.6 `
            -AddToGitHubEnvironment
      - name: Verify mandatory native KiCad runtime
        run: |
          python -c "import os, shutil, subprocess; executable = os.environ.get('PARTSMITH_KICAD_CLI') or shutil.which('kicad-cli'); assert executable, 'kicad-cli not found'; version = subprocess.check_output([executable, 'version'], text=True).strip(); assert version == '10.0.6', version"
      - name: Verify recorded Phase 5 input hashes
        run: python scripts/verify_phase2_manifest.py --manifest docs/gates/phase-5-artifacts.json
      - name: Verify recorded Phase 6 input hashes
        run: python scripts/verify_phase2_manifest.py --manifest docs/gates/phase-6-artifacts.json
      - name: Verify recorded Phase 8 input hashes
        run: python scripts/verify_phase2_manifest.py --manifest docs/gates/phase-8-artifacts.json
      - name: Verify recorded Phase 13.1 input hashes
        run: python scripts/verify_phase2_manifest.py --manifest docs/gates/phase-13.1-artifacts.json
      - name: Verify recorded Phase 13.2 input hashes
        run: python scripts/verify_phase2_manifest.py --manifest docs/gates/phase-13.2-artifacts.json
      - name: Verify recorded Phase 13.3 input hashes
        run: python scripts/verify_phase2_manifest.py --manifest docs/gates/phase-13.3-artifacts.json
      - name: Verify recorded Phase 13.4 input hashes
        run: python scripts/verify_phase2_manifest.py --manifest docs/gates/phase-13.4-artifacts.json
      - name: Verify recorded Phase 13.5 input hashes
        run: python scripts/verify_phase2_manifest.py --manifest docs/gates/phase-13.5-artifacts.json
      - name: Verify recorded Phase 13.6 input hashes
        run: python scripts/verify_phase2_manifest.py --manifest docs/gates/phase-13.6-artifacts.json
      - name: Verify recorded Phase 13.7 input hashes
        run: python scripts/verify_phase2_manifest.py --manifest docs/gates/phase-13.7-artifacts.json
      - name: Verify recorded Phase 13.8 input hashes
        run: python scripts/verify_phase2_manifest.py --manifest docs/gates/phase-13.8-artifacts.json
      - name: Verify recorded full Phase 13 input hashes
        run: python scripts/verify_phase2_manifest.py --manifest docs/gates/phase-13-artifacts.json
      - name: Install pinned third-party source-test dependencies
        run: |
          python -m pip install --requirement requirements-ci.txt
          python -m pip install --requirement requirements-extraction.txt
          python -m pip install kicad-python==0.8.0 protobuf==5.29.6 pynng==0.9.0 sniffio==1.3.1
      - name: Install pinned Windows PCM runtime dependencies
        if: runner.os == 'Windows'
        run: python -m pip install --only-binary :all: --requirement requirements-pcm.txt
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Test
        run: python -m pytest --junitxml=gate-results.xml
      - name: Verify isolated offline PCM contract payload
        run: python scripts/verify_phase13_contracts.py --archive dist/phase13-contract-payload.zip --evidence phase13-contract-payload.json --junit phase13-contract-results.xml
      - name: Build and verify deterministic production PCM payload
        run: |
          python scripts/build_pcm.py --output dist/partsmith-pcm.zip
          python scripts/verify_pcm.py dist/partsmith-pcm.zip --evidence pcm-payload-results.json
      - name: Repeat combined PCM-payload PDF stability gate
        run: python scripts/verify_pdf_stability.py --archive dist/partsmith-pcm.zip --rounds 3 --output pdf-stability-results
      - name: Full isolated Windows PCM runtime regression
        if: runner.os == 'Windows'
        run: python scripts/verify_pcm_acceptance.py dist/partsmith-pcm.zip --output pcm-acceptance-results --desktop
      - name: Check command-line entry point
        run: |
          python -m partsmith version
          python -m partsmith doctor --json
      - name: Preserve phase gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-gates-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            *gate-results.xml
            dist/*.zip
            dist/*.json
            pcm-payload-results.json
            pcm-acceptance-results/*.json
            pcm-acceptance-results/*.txt
            pcm-acceptance-results/*.xml
            pdf-stability-results/*.json
            pdf-stability-results/*.txt
            pdf-stability-results/*.xml
