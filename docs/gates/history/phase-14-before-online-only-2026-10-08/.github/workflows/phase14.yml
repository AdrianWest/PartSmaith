name: Phase 14 executable runtime acceptance

on:
  workflow_dispatch:
    inputs:
      clean_runner:
        description: 'Use a freshly provisioned Windows 11 AMD64 runner labelled partsmith-clean'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  producer:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install producer tools only
        run: python -m pip install jsonschema==4.26.0 zstandard==0.25.0 pefile==2024.8.26 delvewheel==1.12.1
      - name: Verify recorded candidate inputs
        run: python scripts/verify_phase2_manifest.py --manifest docs/gates/phase-14-artifacts.json
      - name: Reconstruct reviewed runtime without resolving dependencies
        run: python scripts/prepare_production_runtime.py --output runtime
      - name: Reproduce additional CAD vendor DLLs and retain audit findings
        run: |
          python scripts/verify_cad_licenses.py --runtime runtime --cache .tools/runtime --output dist/cad-license-verification.json
          python scripts/audit_production_native.py --runtime runtime --output dist/native-license-audit.json
      - name: Build install and upgrade candidates
        run: |
          python scripts/build_production_pcm.py --runtime runtime --output dist/partsmith-0.2.2-pcm.zip
          python scripts/build_production_pcm.py --runtime runtime --version 0.2.3 --output dist/partsmith-0.2.3-pcm.zip
      - uses: actions/upload-artifact@v4
        with:
          name: phase14-runtime-candidates
          compression-level: 0
          path: |
            dist/*.zip
            dist/*.json
            scripts/install_production.ps1
            scripts/verify_phase14_install.ps1
            scripts/verify_production_engines.py
            scripts/setup_kicad.ps1
  customer:
    needs: producer
    runs-on: ${{ inputs.clean_runner && fromJSON('["self-hosted","Windows","X64","partsmith-clean"]') || 'windows-2025' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: phase14-runtime-candidates
      - name: Prepare KiCad only
        shell: powershell
        run: .\scripts\setup_kicad.ps1 -Version 10.0.6 -AddToGitHubEnvironment
      - name: Install, launch, diagnostics, corpus, upgrade and uninstall
        shell: powershell
        run: |
          .\scripts\verify_phase14_install.ps1 -Archive dist/partsmith-0.2.2-pcm.zip `
            -UpgradeArchive dist/partsmith-0.2.3-pcm.zip `
            -OutputDirectory acceptance -GuiSmoke
      - name: Retain acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase14-customer-evidence
          path: |
            acceptance/*.json
            dist/*.json
