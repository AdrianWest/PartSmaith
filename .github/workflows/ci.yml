name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned CI tools and project
        run: |
          python -m pip install --requirement requirements-ci.txt
          python -m pip install -e . --no-deps
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Test
        run: python -m pytest --junitxml=gate-results.xml
      - name: Verify installed wheel and migration resource
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          python -c "import pathlib, subprocess, sys; wheels = list(pathlib.Path('dist').glob('*.whl')); assert len(wheels) == 1, f'Expected exactly one built wheel, found {len(wheels)}'; subprocess.run([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', str(wheels[0])], check=True)"
          python -c "from importlib.resources import files; assert files('partsmith.persistence').joinpath('001_initial.sql').is_file()"
          python -m pytest tests/test_persistence.py --junitxml=wheel-gate-results.xml
      - name: Check command-line entry point
        run: |
          partsmith version
          partsmith doctor --json
      - name: Preserve phase gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-gates-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            *gate-results.xml
            dist/*.whl
