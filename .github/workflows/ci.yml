name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install local multilingual OCR on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes tesseract-ocr tesseract-ocr-eng tesseract-ocr-deu tesseract-ocr-chi-sim
      - name: Install local multilingual OCR on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          $ocrDirectory = Join-Path $env:ProgramFiles 'Tesseract-OCR'
          "$ocrDirectory" | Out-File -FilePath $env:GITHUB_PATH -Append
          foreach ($language in @('eng', 'deu', 'chi_sim')) {
            $model = Join-Path $ocrDirectory "tessdata/$language.traineddata"
            Invoke-WebRequest "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/4.1.0/$language.traineddata" -OutFile $model
          }
      - name: Install pinned KiCad 10 on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          KICAD_VERSION="$(apt-cache madison kicad | awk '$3 ~ /^10\.0\.6/ {print $3; exit}')"
          test -n "$KICAD_VERSION"
          sudo apt-get install --yes "kicad=$KICAD_VERSION"
      - name: Install pinned KiCad 10 on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\scripts\setup_kicad.ps1 -Version 10.0.6 `
            -AddToGitHubEnvironment
      - name: Verify mandatory native KiCad runtime
        run: |
          python -c "import os, shutil, subprocess; executable = os.environ.get('PARTSMITH_KICAD_CLI') or shutil.which('kicad-cli'); assert executable, 'kicad-cli not found'; version = subprocess.check_output([executable, 'version'], text=True).strip(); assert version == '10.0.6', version"
      - name: Verify recorded Phase 5 input hashes
        run: python scripts/verify_phase2_manifest.py --manifest docs/gates/phase-5-artifacts.json
      - name: Verify recorded Phase 6 input hashes
        run: python scripts/verify_phase2_manifest.py --manifest docs/gates/phase-6-artifacts.json
      - name: Verify recorded Phase 8 input hashes
        run: python scripts/verify_phase2_manifest.py --manifest docs/gates/phase-8-artifacts.json
      - name: Install pinned CI tools and project
        run: |
          python -m pip install --requirement requirements-ci.txt
          python -m pip install --requirement requirements-extraction.txt
          python -m pip install -e . --no-deps
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Test
        run: python -m pytest --junitxml=gate-results.xml
      - name: Verify installed wheel and packaged resources
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          python -c "import pathlib, subprocess, sys; wheels = list(pathlib.Path('dist').glob('*.whl')); assert len(wheels) == 1, f'Expected exactly one built wheel, found {len(wheels)}'; subprocess.run([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', str(wheels[0])], check=True)"
          python -c "from importlib.resources import files; from pathlib import Path; assert all(files('partsmith.persistence').joinpath(name).read_bytes() == Path(f'migrations/{name}').read_bytes() for name in ('001_initial.sql', '002_phase8.sql', '003_manifest_rebuilds.sql', '004_node_cache.sql'))"
          python -c "from importlib.resources import files; from pathlib import Path; import partsmith.ir; from partsmith.ir import SUPPORTED_VERSIONS; assert 'site-packages' in str(Path(partsmith.ir.__file__).resolve()); assert all(files('partsmith.ir').joinpath(f'component-ir-{v}.schema.json').read_bytes() == Path(f'schemas/component-ir-{v}.schema.json').read_bytes() for v in SUPPORTED_VERSIONS)"
          python -c "from importlib.resources import files; from pathlib import Path; import partsmith.pdl; root = files('partsmith.pdl'); assert root.joinpath('pdl-1.0.schema.json').read_bytes() == Path('schemas/pdl-1.0.schema.json').read_bytes(); assert root.joinpath('entries/synthetic-0402@1.0.json').read_bytes() == Path('pdl/entries/synthetic-0402@1.0.json').read_bytes(); assert root.joinpath('release-profiles/mvp-1@1.0.json').read_bytes() == Path('pdl/release-profiles/mvp-1@1.0.json').read_bytes()"
          python -c "import partsmith.threed"
          python -c "from importlib.resources import files; from pathlib import Path; root = files('partsmith.release'); assert root.joinpath('runtime-lock-1.0.json').read_bytes() == Path('src/partsmith/release/runtime-lock-1.0.json').read_bytes(); assert root.joinpath('runtime-constraints.txt').read_bytes() == Path('requirements-ci.txt').read_bytes(); assert root.joinpath('replay-bundle-1.0.schema.json').read_bytes() == Path('schemas/replay-bundle-1.0.schema.json').read_bytes()"
          python -m pytest --junitxml=wheel-gate-results.xml
      - name: Repeat combined installed-wheel PDF stability gate
        run: python scripts/verify_pdf_stability.py --rounds 3 --output pdf-stability-results
      - name: Check command-line entry point
        run: |
          partsmith version
          partsmith doctor --json
      - name: Preserve phase gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-gates-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            *gate-results.xml
            dist/*.whl
            pdf-stability-results/*.json
            pdf-stability-results/*.txt
            pdf-stability-results/*.xml
