[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "partsmith"
version = "0.1.0"
description = "Deterministic KiCad component builder for Board Forge Tools."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Board Forge Tools" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "jsonschema==4.26.0", "cadquery==2.8.0",
  "pypdf[crypto]==6.1.3", "pdfplumber==0.11.10", "pypdfium2==5.14.0",
]

[project.optional-dependencies]
gui = [
  "wxPython==4.3.1", "keyring==25.7.0", "Pillow==12.3.0", "numpy==2.5.3",
]
dev = [
  "PyMuPDF==1.28.2",
  "pytest==8.4.2",
  "ruff==0.16.8",
]

[project.scripts]
partsmith = "partsmith.cli:main"
partsmith-gui = "partsmith.gui.__main__:main"
partsmith-kicad-setup = "partsmith.gui.install_kicad:main"

[tool.hatch.build.targets.wheel]
# Historical packaging metadata; Phase 13 uses scripts/build_pcm.py directly.
packages = ["src/partsmith"]

[tool.hatch.build.targets.sdist]
# Gate receipts hash distributions and remain in the repository.
exclude = ["docs/gates"]

[tool.hatch.build.targets.sdist.force-include]
"resources/PartSmith-Banner3.png" = "resources/PartSmith-Banner3.png"

[tool.hatch.build.targets.wheel.force-include]
# Resource declaration also consumed by the source/PCM verification builders.
"resources/PartSmith-Banner.png" = "partsmith/gui/PartSmith-Banner.png"
"resources/PartSmith-Banner3.png" = "partsmith/gui/PartSmith-Banner3.png"
"fixtures/threed/expected/0402.step" = "partsmith/gui/prototype/0402.step"
"fixtures/footprint/expected/0402.kicad_mod" = "partsmith/gui/prototype/0402.kicad_mod"
"fixtures/viewer/0402-placement.json" = "partsmith/gui/prototype/0402-placement.json"
"integrations/kicad/partsmith_setup" = "partsmith/gui/kicad_plugin"
"migrations/001_initial.sql" = "partsmith/persistence/001_initial.sql"
"migrations/002_phase8.sql" = "partsmith/persistence/002_phase8.sql"
"migrations/003_manifest_rebuilds.sql" = "partsmith/persistence/003_manifest_rebuilds.sql"
"migrations/004_node_cache.sql" = "partsmith/persistence/004_node_cache.sql"
"migrations/005_integration.sql" = "partsmith/persistence/005_integration.sql"
"schemas/component-ir-1.0.schema.json" = "partsmith/ir/component-ir-1.0.schema.json"
"schemas/component-ir-1.1.schema.json" = "partsmith/ir/component-ir-1.1.schema.json"
"schemas/component-ir-1.2.schema.json" = "partsmith/ir/component-ir-1.2.schema.json"
"schemas/pdl-1.0.schema.json" = "partsmith/pdl/pdl-1.0.schema.json"
"schemas/phase8-contracts-1.0.schema.json" = "partsmith/release/phase8-contracts-1.0.schema.json"
"schemas/integration-contracts-1.0.schema.json" = "partsmith/integration/integration-contracts-1.0.schema.json"
"schemas/replay-bundle-1.0.schema.json" = "partsmith/release/replay-bundle-1.0.schema.json"
"pdl/entries" = "partsmith/pdl/entries"
"pdl/release-profiles" = "partsmith/pdl/release-profiles"
"requirements-ci.txt" = "partsmith/release/runtime-constraints.txt"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 79
# Historical receipts retain their exact original bytes and code examples.
extend-exclude = [
  "resources", "docs/gates/history",
  "docs/gates/phase-13.8-pcm-regression",
  "docs/gates/phase-13.8-pdf-stability",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
